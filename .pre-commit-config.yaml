repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: Ruff lint staged Python and notebook files
        entry: uv run --extra dev ruff check
        language: system
        files: \.(py|ipynb)$

      - id: ruff-format
        name: Ruff format staged Python and notebook files
        entry: uv run --extra dev ruff format
        language: system
        files: \.(py|ipynb)$

      - id: mypy
        name: Mypy type check (lab package)
        entry: uv run --extra dev mypy -p lab
        language: system
        files: ^src/lab/.*\.py$
        pass_filenames: false

      - id: pytest
        name: Pytest with coverage (pre-push)
        entry: uv run --extra dev pytest --cov=src --cov-fail-under=80
        language: system
        files: ^(src|tests)/.*\.py$
        pass_filenames: false
        stages: [pre-push]
